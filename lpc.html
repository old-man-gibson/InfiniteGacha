<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>InfiniteGacha LPC character generator</title>
<style>
  body { background:#1b1b22; color:#ddd; font-family:system-ui, sans-serif; margin:0; padding:20px; }
  h1 { font-size:18px; font-weight:600; }
  .bar { display:flex; gap:10px; align-items:center; margin-bottom:16px; }
  #grid { display:flex; flex-wrap:wrap; gap:12px; }
  .card { background:#26262f; border-radius:8px; padding:10px; text-align:center; width:160px; }
  canvas { image-rendering:pixelated; width:128px; height:128px; background:#111; border-radius:4px; }
  .label { font-size:12px; margin-top:6px; color:#ddd; }
  .rarity { font-size:13px; letter-spacing:.1em; margin-top:2px; }
  .stats { display:grid; grid-template-columns:repeat(3, 1fr); gap:2px 6px; font-size:11px; margin-top:6px; color:#ccc; }
  .stats b { color:#999; font-weight:600; font-size:9px; }
  button { padding:8px 14px; background:#3b3bd6; color:#fff; border:0; border-radius:6px; cursor:pointer; }
  select { padding:6px; background:#26262f; color:#ddd; border:1px solid #444; border-radius:6px; }
  .credits { font-size:11px; color:#777; margin-top:24px; }
</style>
</head>
<body>
<h1>LPC-based character generator</h1>
<div class="bar">
  <button id="roll">Roll 18</button>
  <select id="race"><option value="">any race</option></select>
</div>
<div id="grid"></div>
<p class="credits">Art from the Universal LPC Spritesheet Character Generator (CC-BY-SA 3.0 / GPL 3.0 / OGA-BY 3.0). Per-item attribution is in ulpc/CREDITS.csv and must ship with any build.</p>
<script src="stats.js"></script>
<script src="lpc.js"></script>
</body>
</html>
